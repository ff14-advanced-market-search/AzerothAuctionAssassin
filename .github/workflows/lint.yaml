---
name: "Npm Linters"

on:
  push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main

jobs:
  "Prettier":
    runs-on: ubuntu-latest
    container: node:20

    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Test scanner and item imports (offline)
        run: node --test tests/*.test.js
      - name: Check Prettier formatting
        run: npm run lint
